name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database that exists only for this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: codementor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/codementor_test
      DATABASE_URL: postgresql://postgres@localhost:5432/codementor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint and typecheck
        run: npm run check
      - name: Verify migrations match schema.prisma (no drift)
        run: |
          npm run db:deploy -w @codementor/api
          npm run db:drift-check -w @codementor/api
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
