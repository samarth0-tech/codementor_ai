# ── Production Docker Compose Setup for CodeMentor AI ────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codementor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-codementor_prod}
    volumes:
      - codementor-prod-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-codementor} -d ${POSTGRES_DB:-codementor_prod}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codementor-internal

  piston:
    image: ghcr.io/engineer-man/piston
    restart: always
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - piston-packages:/piston/packages
    networks:
      - codementor-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      piston:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-codementor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-codementor_prod}
      API_SHARED_SECRET: ${API_SHARED_SECRET:?API_SHARED_SECRET must be set}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CODE_EXECUTOR: piston
      PISTON_API_URL: http://piston:2000/api/v2
    ports:
      - "4000:4000"
    networks:
      - codementor-internal
      - codementor-public

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://api:4000
      API_SHARED_SECRET: ${API_SHARED_SECRET:?API_SHARED_SECRET must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - codementor-internal
      - codementor-public

networks:
  codementor-internal:
    internal: false
  codementor-public:
    driver: bridge

volumes:
  codementor-prod-db:
  piston-packages:
