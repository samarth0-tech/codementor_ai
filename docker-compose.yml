# Local PostgreSQL for development. Usage:
#   cp .env.example .env      (then set POSTGRES_PASSWORD)
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: codementor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: codementor_dev
    ports:
      - "5432:5432"
    volumes:
      - codementor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codementor -d codementor_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codementor-db:
